# Coolify / staging - refuerza .htaccess del repo y evita exponer privados
# Permite .htaccess (AllowOverride All ya seteado en Dockerfile) y bloquea rutas sensibles
# incluso si el .htaccess del repo fuese omitido.

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Bloqueo explicito a nivel Apache (defensa en profundidad, el .htaccess ya hace lo mismo)
<LocationMatch "^/(app|docs|frontend|home|scripts|tests|vendor|writable)(/|$)">
    Require all denied
</LocationMatch>

# .env nunca debe servirse
<FilesMatch "^\.env">
    Require all denied
</FilesMatch>

# Cabeceras staging
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
