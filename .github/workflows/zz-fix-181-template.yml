name: Fix 181 template once

on:
  push:
    branches:
      - feat/issues-180-181-maintenance-history

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issues-180-181-maintenance-history
      - name: Patch Vue template
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/src/pages/operations/EquipmentDetailPage.vue')
          text = path.read_text()
          old = '''        <p v-if="data.workOrderHistory === null" class="text-sm text-ink-muted">No tenés permiso para consultar órdenes de trabajo.</p>
        <template v-else>
'''
          new = '''        <p v-if="!data.workOrderHistory" class="text-sm text-ink-muted">No tenés permiso para consultar órdenes de trabajo.</p>
        <div v-else>
'''
          if old not in text:
              raise SystemExit('No se encontró apertura esperada')
          text = text.replace(old, new, 1)
          old = '''          <template #footer><PaginationBar :pagination="data.workOrderHistory.pagination" /></template>
        </template>
      </PanelCard>'''
          new = '''        </div>
        <template v-if="data.workOrderHistory" #footer><PaginationBar :pagination="data.workOrderHistory.pagination" /></template>
      </PanelCard>'''
          if old not in text:
              raise SystemExit('No se encontró cierre esperado')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-181-template.yml
          git add frontend/src/pages/operations/EquipmentDetailPage.vue
          git commit -m "fix(#181): corregir estructura del panel historial"
          git push origin HEAD:feat/issues-180-181-maintenance-history
