name: Issue 15 check

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/issue-15-biblioteca-preventiva
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, mysqli, zip, gd
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: composer test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend build is reproducible and assets/dashboard is committed in sync
        run: |
          # Los bundles de assets/dashboard estan versionados porque app/Views/app.php
          # los lee del webroot. verify:build-sync reconstruye y compara: si el build
          # determinista cambia esos archivos, el PR publico una UI que no corresponde
          # con el source de main. Fallar aqui es intencional; la correccion es
          # reconstruir y commitear los bundles junto al source.
          npm --prefix frontend run verify:build-sync
      - name: Export rebuilt dashboard assets for PR repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-assets-pr-460
          path: assets/dashboard
          retention-days: 1
      - name: Commit rebuilt dashboard assets to PR branch
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          rm -rf /tmp/dashboard-built
          cp -a assets/dashboard /tmp/dashboard-built
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout "$GITHUB_HEAD_REF"
          rm -rf assets/dashboard
          cp -a /tmp/dashboard-built assets/dashboard
          git add assets/dashboard
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync dashboard assets for #453"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Dashboard asset tooling self-test
        run: python scripts/dashboard-assets.py self-test
