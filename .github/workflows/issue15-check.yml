name: Issue 15 check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/issue-15-biblioteca-preventiva
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, mysqli, zip, gd
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: composer test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Commit rebuilt dashboard assets
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/rebuild-assets-post-pr29'
        run: |
          if git diff --quiet -- assets/dashboard; then
            echo "No hay cambios en assets/dashboard"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/dashboard
          git commit -m "build: regenerar dashboard con UI integrada"
          git push origin HEAD:${{ github.head_ref }}
