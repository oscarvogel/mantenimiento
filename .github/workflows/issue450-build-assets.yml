name: Issue 450 build assets

on:
  push:
    branches:
      - feat/issue-450-user-whatsapp-phone

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
      - name: Commit dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/dashboard
          if git diff --cached --quiet; then
            echo "ASSETS_ALREADY_SYNCED=YES"
            exit 0
          fi
          git commit -m "build(frontend): sincronizar assets dashboard issue 450"
          git push origin HEAD:feat/issue-450-user-whatsapp-phone
